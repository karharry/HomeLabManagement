name: Windows build
on:
  push:
    paths: ["Windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["Windows/**"]
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: .\build.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: HomeLabManagement-win64
          path: Windows/dist/*.zip
