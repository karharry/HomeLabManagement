name: HomeLabManagement
options:
  bundleIdPrefix: com.karharry
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer Team ID here (or pick it in Xcode > Signing & Capabilities)
    DEVELOPMENT_TEAM: H733G484XF
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: 0.12.0
targets:
  HomeLabManagement:
    type: application
    platform: macOS
    sources: [App, Shared]
    dependencies:
      - target: HomeLabWidgets
        embed: true
      - package: Citadel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karharry.homelabmanagement
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleName: HomeLab Management
        CFBundleDisplayName: HomeLab Management
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(TeamIdentifierPrefix)group.com.karharry.homelabmanagement
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: false
        CFBundleURLTypes:
          - CFBundleURLSchemes: [homelabmanagement]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)group.com.karharry.homelabmanagement]
  # Public-release variant: no App Sandbox, no App Groups, no embedded widget. Any entitlement
  # (sandbox included) needs a provisioning profile tied to a paid Developer Program team to work on
  # a machine other than the one it was built on — plain zero-entitlement ad-hoc signing has no such
  # requirement, so this is what makes a free, "just works for anyone" release possible. The widget
  # needs App Groups to share data with the app, so it's necessarily absent from this build; the
  # regular HomeLabManagement target above (built locally via Xcode) is unaffected and keeps it.
  HomeLabManagementDist:
    type: application
    platform: macOS
    sources: [App, Shared]
    dependencies:
      - package: Citadel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karharry.homelabmanagement
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        DEVELOPMENT_TEAM: ""
    info:
      path: App/InfoDist.plist
      properties:
        CFBundleName: HomeLab Management
        CFBundleDisplayName: HomeLab Management
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: false
        CFBundleURLTypes:
          - CFBundleURLSchemes: [homelabmanagement]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  HomeLabWidgets:
    type: app-extension
    platform: macOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karharry.homelabmanagement.widgets
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        AppGroupID: $(TeamIdentifierPrefix)group.com.karharry.homelabmanagement
        CFBundleName: HomeLab Widgets
        CFBundleDisplayName: HomeLab Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)group.com.karharry.homelabmanagement]
